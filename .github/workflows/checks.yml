# Quality checks on every push and pull request: type check, build, accessibility and
# behavior tests (axe + Playwright). Lighthouse is added once the Explorer exists.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: 3D model matches EVIDENCE.md
        run: npm run model:check
      - name: ClinicalTrials.gov still answers (the site itself uses the saved list)
        run: node scripts/fetch-studies.mjs --out "$RUNNER_TEMP/studies.json"
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility and behavior tests
        run: npm test
      - name: Lighthouse (mobile) on Home and 3D Explorer
        run: |
          npx astro preview --port 4323 &
          for i in $(seq 1 30); do curl -sf http://localhost:4323/ >/dev/null && break; sleep 2; done
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run lighthouse -- http://localhost:4323
      - name: Keep the Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results.json
          if-no-files-found: ignore
