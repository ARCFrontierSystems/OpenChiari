# Publishes the site to Cloudflare Pages whenever main changes (merging a pull request into main is the go-ahead,
# CLAUDE.md: "Do not deploy anything without Matthew's go-ahead"). It can also be run by hand from the Actions tab.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the permission  Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
# Without them the job is skipped, so nothing fails before they're added.
#
# On the first run it creates the Pages project "openchiari" and asks Cloudflare to attach openchiari.org and
# www.openchiari.org (both steps are skipped quietly when already done).
# The domain also needs DNS records in Cloudflare (added by hand on Nov 5, 2026): CNAME @ and CNAME www, both
# pointing to openchiari.pages.dev, proxied. Without them the address can't be found.
name: Deploy

on:
  push:
    branches: [main]
  # Every morning, so the Research studies list is refreshed from ClinicalTrials.gov (Matthew chose automatic
  # publishing for these updates on Nov 5, 2026; only the registry's facts change, plain summaries still need approval).
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: openchiari
    steps:
      - name: Check the Cloudflare secrets are set
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."; fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - name: Refresh research studies from ClinicalTrials.gov
        id: studies
        if: steps.secrets.outputs.ok == 'true'
        run: npm run studies:fetch
      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: npm run build
      - name: Create the Pages project (first run only)
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || echo "Project already exists."
      - name: Upload the site
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main
      - name: Attach openchiari.org (first run only)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          for domain in openchiari.org www.openchiari.org; do
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$domain\"}" | grep -o '"success":[a-z]*' || true
          done
      - name: List studies still waiting for a plain summary (one open issue, kept up to date)
        if: steps.secrets.outputs.ok == 'true' && steps.studies.outputs.waiting != ''
        # A problem here (for example, issues turned off for the repository) never fails the publish.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WAITING: ${{ steps.studies.outputs.waiting }}
        run: |
          title="Research studies waiting for a plain summary"
          body="These recruiting studies need a plain summary (they show the official one until it is written, checked against the listing and approved), or their listing has changed since their summary was checked (src/data/study-summaries.json):"$'\n\n'
          for id in ${WAITING//,/ }; do body+="- [$id](https://clinicaltrials.gov/study/$id)"$'\n'; done
          body+=$'\n'"Updated automatically by the Deploy workflow."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body";
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
