# Every Monday: are the links that leave the site still there? (scripts/check-links.mjs)
# A failed run means a page or study link has gone; GitHub emails the owner. It can also be run by hand.
name: Outside links

on:
  schedule:
    - cron: '41 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check outside links
        run: node scripts/check-links.mjs
