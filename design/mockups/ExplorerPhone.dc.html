<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Explorer — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #1A1C20; color: #ECEAE4; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px;">
  <header style="height: 56px; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid #2A2C31; background: #17181C;">
    <a href="HomePhone.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEAE4;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="flex: 1 1 auto; font-weight: 600; font-size: 16px;">3D Explorer</span>
    <a href="TourPhone.dc.html" style="min-height: 36px; display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid #3A3C42; border-radius: 4px; color: #ECEAE4; text-decoration: none; font-size: 13px;">Tour</a>
    <a href="ExplainView.dc.html" aria-label="Explain It: share this view" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEAE4;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>
    </a>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    <div style="width: 330px;"><dc-import name="Anatomy" condition="{{condition}}" flow="{{flow}}" labels="{{no}}" measure="{{measure}}" dark="{{yes}}" hint-size="330px,390px"></dc-import></div>
    <div style="position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px;">
      <button type="button" aria-pressed="{{flow}}" onClick="{{toggleFlow}}" style="{{flowStyle}}">Flow</button>
      <button type="button" aria-pressed="{{measure}}" onClick="{{toggleMeasure}}" style="{{measureStyle}}">Measure</button>
      <button type="button" style="min-height: 40px; padding: 0 10px; border-radius: 4px; border: 1px solid #3A3C42; background: #17181C; color: #ECEAE4; font: 500 13px 'IBM Plex Sans', sans-serif;">Layers</button>
    </div>
  </div>

  <div style="flex: 0 0 auto; background: #17181C; border-top: 1px solid #2A2C31; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A3C42; align-self: center;" aria-hidden="true"></div>
    <div role="radiogroup" aria-label="Condition" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #2A2C31; border-radius: 4px;">
      <sc-for list="{{conditions}}" as="c" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A3A1A9;">{{title}}</p>
      <p style="margin: 0; line-height: 1.5; color: #D2D0CA;">{{note}}</p>
    </div>
    <button type="button" style="min-height: 44px; border: 1px solid #3A3C42; border-radius: 4px; background: transparent; color: #ECEAE4; font: 500 14px 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 14px;">
      <span>Parts list · tap a part in the model</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
    </button>
    <p style="margin: 0; font-size: 11px; color: #8A8890; text-align: center;">Illustration, not a medical image</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { condition: 'chiari', flow: true, measure: true };
  }
  renderVals() {
    const s = this.state;
    const conds = [
      { id: 'typical', label: 'Typical', title: 'Typical anatomy', note: 'Tonsils usually sit at or above the skull opening (a few millimeters below can be normal); fluid moves freely.' },
      { id: 'chiari', label: 'Chiari I', title: 'Chiari I', note: 'Tonsils extend below the opening and crowd the fluid space; in many people flow slows there.' },
      { id: 'syrinx', label: 'With syrinx', title: 'Chiari I with syrinx', note: 'A fluid-filled cavity has formed inside the spinal cord.' },
      { id: 'surgery', label: 'After surgery', title: 'After decompression', note: 'Bone is removed at the back of the opening to make room. Most people improve or stabilize; results vary.' }
    ];
    const tool = (x) => 'min-height: 40px; padding: 0 10px; border-radius: 4px; font: 500 13px \'IBM Plex Sans\', sans-serif; color: #ECEAE4; border: 1px solid ' + (x ? '#7FB3D3' : '#3A3C42') + '; background: ' + (x ? '#1F3A4D' : '#17181C') + ';';
    const cur = conds.find((c) => c.id === s.condition);
    return {
      yes: true, no: false,
      condition: s.condition, flow: s.flow, measure: s.measure,
      conditions: conds.map((c, i) => ({
        label: c.label,
        checked: s.condition === c.id ? 'true' : 'false',
        pick: () => this.setState({ condition: c.id }),
        style: 'min-height: 44px; border: 0; ' + (i % 2 ? 'border-left: 1px solid #2A2C31; ' : '') + (i > 1 ? 'border-top: 1px solid #2A2C31; ' : '') + 'background: ' + (s.condition === c.id ? '#2A2C31' : 'transparent') + '; color: #ECEAE4; font: ' + (s.condition === c.id ? '600' : '400') + ' 14px \'IBM Plex Sans\', sans-serif;'
      })),
      title: cur.title,
      note: cur.note,
      flowStyle: tool(s.flow),
      measureStyle: tool(s.measure),
      toggleFlow: () => this.setState({ flow: !s.flow }),
      toggleMeasure: () => this.setState({ measure: !s.measure })
    };
  }
}
</script>
</body>
</html>
