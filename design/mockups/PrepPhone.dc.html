<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doctor visit prep — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1500px; display: flex; flex-direction: column; background: #F5F5F3; color: #1C1D21; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5;">
  <header style="min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 20px; border-bottom: 1px solid #DCDBD6; background: #FFFFFF;">
    <a href="HomePhone.dc.html" style="flex: 1 1 auto; display: flex; align-items: center; gap: 10px; color: #1C1D21; text-decoration: none;"><span style="width: 9px; height: 9px; background: #6B4FA0;" aria-hidden="true"></span><span style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 18px;">Open Chiari</span></a>
    <button type="button" aria-label="Open menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1D21" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>

  <section style="padding: 28px 20px 8px; display: flex; flex-direction: column; gap: 10px;">
    <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15;">Prepare for your next appointment</h1>
    <p style="margin: 0; color: #3B3C42;">Tick what you want to ask. Nothing is saved or sent.</p>
  </section>

  <form aria-label="Choose questions" style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 20px;">
    <fieldset style="margin: 0; padding: 12px 0 0; border: 0; border-top: 2px solid #1C1D21; display: flex; flex-direction: column;">
      <legend style="float: left; width: 100%; padding: 0 0 4px; font-weight: 600; font-size: 17px;">About my diagnosis</legend>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;"><input type="checkbox" checked style="accent-color: #1F5F8B; margin: 2px 0 0; width: 20px; height: 20px; flex: 0 0 auto;"> Which type of Chiari do I have?</label>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;"><input type="checkbox" checked style="accent-color: #1F5F8B; margin: 2px 0 0; width: 20px; height: 20px; flex: 0 0 auto;"> Can I have a copy of my MRI report and images?</label>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;"><input type="checkbox" style="accent-color: #1F5F8B; margin: 2px 0 0; width: 20px; height: 20px; flex: 0 0 auto;"> Do I have a syrinx?</label>
    </fieldset>
    <fieldset style="margin: 0; padding: 12px 0 0; border: 0; border-top: 1px solid #DCDBD6; display: flex; flex-direction: column;">
      <legend style="float: left; width: 100%; padding: 0 0 4px; font-weight: 600; font-size: 17px;">My symptoms</legend>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;"><input type="checkbox" checked style="accent-color: #1F5F8B; margin: 2px 0 0; width: 20px; height: 20px; flex: 0 0 auto;"> Which of my symptoms come from Chiari?</label>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;"><input type="checkbox" checked style="accent-color: #1F5F8B; margin: 2px 0 0; width: 20px; height: 20px; flex: 0 0 auto;"> What should make me call you or go to the ER?</label>
    </fieldset>
    <details style="border-top: 1px solid #DCDBD6; padding: 14px 0;"><summary style="font-weight: 600; font-size: 17px; min-height: 28px;">Tests and monitoring · 2</summary></details>
    <details style="border-top: 1px solid #DCDBD6; padding: 14px 0;"><summary style="font-weight: 600; font-size: 17px; min-height: 28px;">Treatment · 3</summary></details>
    <details style="border-top: 1px solid #DCDBD6; border-bottom: 1px solid #DCDBD6; padding: 14px 0;"><summary style="font-weight: 600; font-size: 17px; min-height: 28px;">Daily life and research · 2</summary></details>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="own-p" style="font-weight: 600;">Add your own question</label>
      <input id="own-p" type="text" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #A9A8A2; border-radius: 4px; background: #FFFFFF; font: 400 16px 'IBM Plex Sans', sans-serif;">
    </div>
  </form>

  <div style="margin-top: auto; position: sticky; bottom: 0; padding: 16px 20px 24px; background: #FFFFFF; border-top: 1px solid #DCDBD6; display: flex; flex-direction: column; gap: 10px;">
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E5F66;">6 questions selected</p>
    <div style="display: flex; gap: 8px;">
      <a href="PrepSheet.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 4px; background: #1F5F8B; color: #FFFFFF; font-weight: 500; text-decoration: none;">Preview and print</a>
      <button type="button" style="flex: 1 1 0; min-height: 48px; border: 1px solid #1C1D21; border-radius: 4px; background: #FFFFFF; font: 500 15px 'IBM Plex Sans', sans-serif;">Save as PDF</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
